[package]
name = "toxi-template"
version = "3.1.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "Template engine for server-side rendering in Toxi"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["template", "rendering", "html", "ssr", "web"]
categories = ["template-engine", "web-programming"]

[dependencies]
regex = "1.11.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toxi-core = { path = "../toxi-core", version = "3.1.0" }
http = "1.1.0"
tokio = { version = "1.48.0", features = ["fs", "io-util"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"
